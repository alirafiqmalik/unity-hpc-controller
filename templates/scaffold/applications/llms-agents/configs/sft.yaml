# Axolotl SFT config. train_job.sh replaces __CACHE__, __CHECKPOINT__, __PARALLEL__.
base_model: meta-llama/Llama-3.2-1B
datasets:
  - path: __CACHE__/sft.jsonl
    type: sharegpt
    ds_type: json
dataset_prepared_path: __CACHE__/sft-prepared
val_set_size: 0.0
output_dir: __CHECKPOINT__
sequence_len: 2048
sample_packing: false
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 0.00002
bf16: true
flash_attention: true
warmup_ratio: 0.03
logging_steps: 1
saves_per_epoch: 1
special_tokens:
  pad_token: <|end_of_text|>
fsdp_config: __PARALLEL__
