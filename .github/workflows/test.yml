name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python and dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .codex-plugin/plugin.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: controller/web/package-lock.json
      - name: Build the dashboard
        working-directory: controller/web
        run: |
          npm ci
          npm run build
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q -ra --tb=short
      - name: Dashboard browser smoke test
        env:
          UNITY_HPC_UI_SMOKE: "1"
        run: python -m pytest tests/test_controller_web_smoke.py -q -ra --tb=short

  release-check:
    name: Plugin version guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shipped changes and manifest versions
        run: |
          scripts/release-check --base origin/${{ github.base_ref }}
